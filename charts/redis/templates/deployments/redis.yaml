apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis.fullname" $ }}
  labels: {{- include "redis.labels" $ | nindent 4 }}
spec:
  {{- with .Values.redis }}
  {{- $redisDefaultConfigName := printf "%s-default-config" (include "redis.fullname" $) }}
  replicas: {{ .replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "redis.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      {{- if .annotations }}
      annotations: {{- toYaml .annotations | nindent 8 }}
      {{- end }}
      labels: {{- include "redis.selectorLabels" $ | nindent 8 }}
    spec:
      initContainers:
        - name: {{ $.Chart.Name }}-bootstrap
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /config/conf.d
              cat > /config/redis.conf <<'EOF'
              include /usr/local/etc/redis/conf.d/*.conf
              EOF
              
              cat > /config/conf.d/01-default.conf <<'EOF'
              user default off
              user probe on nopass -@all +ping
              EOF
          volumeMounts:
            - name: {{ $redisDefaultConfigName }}
              mountPath: /config
      containers:
        {{- with .containers.redis }}
        - name: {{ $.Chart.Name }}
          {{- with .image }}
          image: "{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          {{- end }}
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          {{- if .env }}
          env: {{- toYaml .env | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .port | default 6379 }}
              name: redis
              protocol: TCP
          startupProbe:
            exec:
              command:
                - redis-cli
                - --user
                - probe
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - probe
                - ping
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - probe
                - ping
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ $redisDefaultConfigName }}
              mountPath: /usr/local/etc/redis
            {{- if .volumeMounts }}
            {{- toYaml .volumeMounts | nindent 12 }}
            {{- end }}
        {{- end }}
      {{- if .hostname }}
      hostname: {{ .hostname }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      volumes:
        - name: {{ $redisDefaultConfigName }}
          emptyDir: {}
        {{- if .volumes }}
        {{- toYaml .volumes | nindent 8 }}
        {{- end }}
  {{- end }}
